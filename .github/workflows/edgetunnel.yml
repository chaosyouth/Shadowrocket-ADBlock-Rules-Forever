name: Update edgetunnel configuration

on:
  workflow_dispatch:
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: '0 1 * * *'
  push:
    branches: [release]
    paths:
      - scripts/generate_edgetunnel.py
      - scripts/test_generate_edgetunnel.py
      - .github/workflows/edgetunnel.yml
      - custom/reference.json

permissions:
  contents: write

concurrency:
  group: edgetunnel-config
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
      - name: Test generator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Read upstream release
        uses: actions/checkout@v4
        with:
          repository: Johnshall/Shadowrocket-ADBlock-Rules-Forever
          ref: release
          path: upstream-src
          persist-credentials: false
      - name: Generate all custom configurations
        run: python3 scripts/generate_edgetunnel.py upstream-src custom edgetunnel.conf
      - name: Publish only changed output
        run: |
          git add -A -- custom edgetunnel.conf
          if git diff --cached --quiet; then
            echo 'Configuration unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update edgetunnel configuration from upstream'
          git push origin HEAD:release
